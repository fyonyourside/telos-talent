name: Feishu Daily Report

# 触发方式：
#   1. push 到 gh-pages（任意文件变更）+ commit 消息以 "Daily update" 开头
#      → feishu_sync 推送后 Actions 发飞书卡片（不再用 paths 仅 leads.json，避免只改看板时不触发）
#   2. workflow_dispatch（手动在 Actions 页点 Run workflow 测试）
on:
  push:
    branches: [gh-pages]
    # 注意：不要只用 paths: leads.json。feishu_sync 常只改 dashboard.html（LEADS_DATA），
    # 若 leads 二进制未变，旧配置会导致本 workflow 根本不跑 → 飞书永远旧内容。
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "手动触发，无条件发送"
            echo "send=true" >> $GITHUB_OUTPUT
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "Commit: $MSG"
            # 只有定时任务的 "Daily update YYYY-MM-DD" 提交才发飞书
            # 浏览器端的 "chore: update lead status" 提交直接跳过
            if [[ "$MSG" == Daily\ update* ]]; then
              echo "send=true" >> $GITHUB_OUTPUT
            else
              echo "send=false" >> $GITHUB_OUTPUT
              echo "⏭️ 非每日任务提交，跳过飞书推送"
            fi
          fi

      - name: Checkout
        if: steps.check.outputs.send == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Send Feishu webhook card
        if: steps.check.outputs.send == 'true'
        env:
          # 群1（原有）
          FEISHU_WEBHOOK_URL:      ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET:   ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          # 群2（新增；未在 Secrets 中设置时脚本会自动跳过）
          FEISHU_WEBHOOK_URL_2:    ${{ secrets.FEISHU_WEBHOOK_URL_2 }}
          FEISHU_WEBHOOK_SECRET_2: ${{ secrets.FEISHU_WEBHOOK_SECRET_2 }}
        run: python3 .github/scripts/feishu_notify.py
