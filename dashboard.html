<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELOS · 人才看板</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal:     #0C2E32;
  --teal-lt:  #0F3A3F;
  --teal-md:  #14464C;
  --amber:    #E8962A;
  --amber-lt: #F5B458;
  --amber-gl: #FAD878;
  --parchment:#F1E6C4;
  --eng:      #1E4D2B;
  --eng-lt:   #2A6B3A;
  --eng-bg:   #0F2E18;
  --pm:       #4D3A00;
  --pm-lt:    #A06800;
  --pm-bg:    #2A2000;
  --both:     #2D1A4D;
  --both-lt:  #6B3DAA;
  --both-bg:  #1A0E2E;
  --text:     rgba(255,255,255,0.85);
  --text-dim: rgba(255,255,255,0.38);
  --text-mid: rgba(255,255,255,0.58);
  --border:   rgba(255,255,255,0.07);
  --card-bg:  #0F3A3F;
  --card-hover: #144048;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--teal); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #081E21 0%, var(--teal) 100%);
  border-bottom: 1px solid var(--border);
  padding: 24px 32px 20px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.brand { display:flex; align-items:center; gap:16px; }
.brand-logo { display:flex; align-items:center; gap:10px; }
.brand-name {
  font-family:'Cormorant Garant',serif; font-style:italic; font-weight:300;
  font-size:22px; color:var(--amber); letter-spacing:0.04em;
}
.brand-divider { width:1px; height:20px; background:var(--border); }
.brand-sub { font-size:11px; color:var(--text-dim); letter-spacing:0.12em; text-transform:uppercase; }
.updated { font-size:10px; color:var(--text-dim); }

/* Stats bar */
.stats { display:flex; gap:6px; flex-wrap:wrap; }
.stat {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius:6px; padding:8px 14px;
  display:flex; flex-direction:column; gap:2px; min-width:90px;
}
.stat-n { font-size:20px; font-weight:600; color:var(--amber-lt); line-height:1; }
.stat-l { font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
.stat.accent { border-color:rgba(232,150,42,0.3); background:rgba(232,150,42,0.06); }
.stat.voice-stat .stat-n { color:#6CD97E; }

/* ── Filters ── */
.filters {
  padding: 14px 32px;
  background: rgba(8,30,33,0.8);
  border-bottom: 1px solid var(--border);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.search-wrap { position:relative; flex:1; min-width:180px; max-width:300px; }
.search-wrap input {
  width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--border);
  border-radius:6px; padding:8px 12px 8px 34px; color:var(--text);
  font-size:13px; font-family:'Inter',sans-serif; outline:none;
  transition: border-color .2s;
}
.search-wrap input:focus { border-color:rgba(232,150,42,0.4); }
.search-wrap input::placeholder { color:var(--text-dim); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:0.4; font-size:13px; }

.filter-group { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.filter-label { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; white-space:nowrap; }
.chip {
  padding:5px 12px; border-radius:20px; font-size:11px; font-weight:500; cursor:pointer;
  border:1px solid var(--border); background:rgba(255,255,255,0.04);
  color:var(--text-mid); transition:all .15s; white-space:nowrap; user-select:none;
}
.chip:hover { background:rgba(255,255,255,0.08); }
.chip.active { color:#fff; border-color:transparent; }
.chip.all.active    { background:rgba(255,255,255,0.15); }
.chip.eng.active    { background:var(--eng-lt); border-color:var(--eng-lt); }
.chip.pm.active     { background:var(--pm-lt);  border-color:var(--pm-lt); }
.chip.both.active   { background:var(--both-lt);border-color:var(--both-lt); }
.chip.voice-f.active    { background:#1A7A2E; border-color:#1A7A2E; }
.chip.new-f.active      { background:rgba(232,150,42,0.5); border-color:var(--amber); color:#fff; }
.chip.converted-f       { border-color:rgba(130,210,130,0.3); color:#89DDAA; }
.chip.converted-f.active{ background:rgba(130,210,130,0.25); border-color:rgba(130,210,130,0.6); color:#89DDAA; }
.chip.acad.active       { background:rgba(255,80,80,0.3); border-color:rgba(255,80,80,0.4); }

/* ── Grid ── */
.grid-wrap { padding:24px 32px 48px; }
.grid-info { font-size:11px; color:var(--text-dim); margin-bottom:16px; letter-spacing:0.05em; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:14px; }
.empty { text-align:center; padding:80px 20px; color:var(--text-dim); font-size:13px; }

/* ── Card ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius:10px; padding:18px 20px;
  cursor:pointer; transition:all .18s;
  display:flex; flex-direction:column; gap:12px;
  position:relative;
}
.card:hover { background:var(--card-hover); border-color:rgba(232,150,42,0.2); transform:translateY(-1px); }
.card.academic-card { opacity:0.65; }
.card.academic-card:hover { opacity:0.85; }

/* card header */
.card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-name { font-size:14px; font-weight:600; color:var(--text); line-height:1.3; }
.card-name-sub { font-size:11px; color:var(--text-dim); margin-top:2px; }
.badges { display:flex; gap:6px; align-items:center; flex-shrink:0; }

/* role badge */
.role-badge {
  font-size:9px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; white-space:nowrap;
}
.role-badge.eng  { background:var(--eng-bg); color:#6CD97E; border:1px solid rgba(50,180,80,0.25); }
.role-badge.pm   { background:var(--pm-bg);  color:#F5B458; border:1px solid rgba(200,130,0,0.25); }
.role-badge.both { background:var(--both-bg);color:#B57FEA; border:1px solid rgba(130,80,200,0.25); }
.role-badge.acad { background:rgba(180,0,0,0.15); color:#FF8080; border:1px solid rgba(180,0,0,0.2); font-size:8px; }

/* score dots */
.score-dots { display:flex; gap:3px; }
.dot { width:7px; height:7px; border-radius:50%; }
.dot.on  { background:var(--amber); }
.dot.off { background:rgba(255,255,255,0.1); }

/* card meta */
.card-meta { display:flex; flex-direction:column; gap:4px; }
.meta-row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); }
.meta-icon { width:14px; text-align:center; opacity:0.5; font-size:11px; }
.meta-val { color:var(--text-mid); }
.meta-val.accent { color:var(--amber-lt); }

/* skills tags */
.skills { display:flex; flex-wrap:wrap; gap:4px; }
.skill-tag {
  font-size:9px; padding:2px 7px; border-radius:3px;
  background:rgba(255,255,255,0.06); color:var(--text-dim);
  border:1px solid rgba(255,255,255,0.08); white-space:nowrap;
}
.skill-tag.voice { background:rgba(50,180,80,0.12); color:#6CD97E; border-color:rgba(50,180,80,0.2); }

/* card footer */
.card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
.platforms { display:flex; gap:8px; align-items:center; }
.platform-link {
  font-size:10px; color:var(--text-dim); text-decoration:none;
  background:rgba(255,255,255,0.05); border:1px solid var(--border);
  padding:3px 8px; border-radius:4px; transition:all .15s; display:flex; gap:4px; align-items:center;
}
.platform-link:hover { background:rgba(255,255,255,0.1); color:var(--text); }
.platform-link.xhs { color:#FF5E7A; border-color:rgba(255,94,122,0.25); background:rgba(255,94,122,0.07); }
.platform-link.xhs:hover { background:rgba(255,94,122,0.15); }
.voice-badge {
  font-size:9px; padding:3px 8px; border-radius:4px;
  background:rgba(50,180,80,0.12); color:#6CD97E;
  border:1px solid rgba(50,180,80,0.2); white-space:nowrap;
}

/* status button */
.status-btn {
  font-size:10px; font-weight:500; padding:4px 10px; border-radius:5px;
  border:1px solid; cursor:pointer; transition:all .15s; white-space:nowrap;
  font-family:'Inter',sans-serif;
}
.status-btn.new      { border-color:rgba(232,150,42,0.3); color:var(--amber-lt); background:rgba(232,150,42,0.08); }
.status-btn.contacted{ border-color:rgba(100,160,255,0.3); color:#82AAFF; background:rgba(100,160,255,0.08); }
.status-btn.replied  { border-color:rgba(50,200,100,0.3); color:#6CD97E; background:rgba(50,200,100,0.08); }
.status-btn.pass      { border-color:rgba(180,80,80,0.3); color:#FF8080; background:rgba(180,80,80,0.08); }
.status-btn.converted { border-color:rgba(130,210,130,0.4); color:#89DDAA; background:rgba(130,210,130,0.10); }
.status-btn:hover { opacity:0.8; }

/* notes */
.card-notes { font-size:10px; color:var(--text-dim); line-height:1.6; border-top:1px solid var(--border); padding-top:10px; }

/* academic warning */
.acad-warning {
  font-size:9px; color:#FF8080; background:rgba(180,0,0,0.1);
  border:1px solid rgba(180,0,0,0.2); border-radius:4px;
  padding:4px 8px; display:flex; align-items:center; gap:4px;
}

/* ── Modal ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(6,20,22,0.85);
  z-index:200; backdrop-filter:blur(6px); align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:#0D3238; border:1px solid rgba(232,150,42,0.2);
  border-radius:14px; width:90%; max-width:600px; max-height:88vh;
  overflow-y:auto; padding:28px; position:relative;
}
.modal-close {
  position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.07);
  border:1px solid var(--border); border-radius:6px; padding:4px 10px;
  color:var(--text-dim); cursor:pointer; font-size:12px; font-family:'Inter',sans-serif;
}
.modal-close:hover { background:rgba(255,255,255,0.12); }
.modal-title { font-size:18px; font-weight:600; color:var(--text); margin-bottom:4px; }
.modal-sub   { font-size:12px; color:var(--text-dim); margin-bottom:20px; }
.modal-section { margin-bottom:18px; }
.modal-section-title { font-size:9px; text-transform:uppercase; letter-spacing:0.16em; color:var(--amber); margin-bottom:8px; }
.modal-field { font-size:12px; color:var(--text-mid); line-height:1.7; }
.modal-link  { color:var(--amber-lt); text-decoration:none; }
.modal-link:hover { text-decoration:underline; }
.modal-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; }
.modal-btn {
  padding:8px 16px; border-radius:6px; font-size:12px; font-weight:500;
  cursor:pointer; font-family:'Inter',sans-serif; border:1px solid;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.modal-btn.primary { background:var(--amber); color:#0C2E32; border-color:var(--amber); }
.modal-btn.primary:hover { background:var(--amber-lt); }
.modal-btn.sec { background:rgba(255,255,255,0.05); color:var(--text-mid); border-color:var(--border); }
.modal-btn.sec:hover { background:rgba(255,255,255,0.1); }

/* note editor */
.note-editor {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:6px; padding:10px; color:var(--text); font-size:12px;
  font-family:'Inter',sans-serif; resize:vertical; min-height:70px; outline:none;
  transition: border-color .2s;
}
.note-editor:focus { border-color:rgba(232,150,42,0.4); }
.note-save {
  margin-top:6px; padding:5px 12px; background:rgba(232,150,42,0.15);
  border:1px solid rgba(232,150,42,0.3); border-radius:5px;
  color:var(--amber-lt); font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;
}
.note-save:hover { background:rgba(232,150,42,0.25); }

/* ── Priority ── */
.priority-btn {
  width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
  background:rgba(255,255,255,0.04); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0; line-height:1;
}
.priority-btn:hover { background:rgba(250,216,120,0.15); border-color:rgba(250,216,120,0.3); }
.priority-btn.on { background:rgba(250,216,120,0.18); border-color:rgba(250,216,120,0.45); }
.priority-btn.on::before { content:'⭐'; }
.priority-btn.off::before { content:'☆'; opacity:0.45; }

/* ── Delete (card) ── */
.delete-btn {
  width:24px; height:24px; border-radius:6px; border:1px solid transparent;
  background:transparent; cursor:pointer; font-size:12px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); opacity:0.35; transition:all .15s; flex-shrink:0;
}
.delete-btn:hover { opacity:1; color:#FF7070; border-color:rgba(255,80,80,0.35); background:rgba(255,80,80,0.08); }
.card:hover .delete-btn { opacity:0.65; }

/* ── Delete (modal) ── */
.modal-delete-btn {
  background:rgba(255,80,80,0.08); border:1px solid rgba(255,80,80,0.3);
  color:#FF8080; padding:8px 14px; border-radius:6px; font-size:12px;
  cursor:pointer; transition:all .15s;
}
.modal-delete-btn:hover { background:rgba(255,80,80,0.18); border-color:rgba(255,80,80,0.5); color:#FF9999; }

/* Priority panel */
.priority-panel {
  margin: 20px 32px 0;
  background: rgba(250,216,120,0.05);
  border: 1px solid rgba(250,216,120,0.2);
  border-radius: 10px; overflow:hidden;
}
.priority-panel-head {
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 18px; cursor:pointer; user-select:none;
  border-bottom: 1px solid rgba(250,216,120,0.12);
}
.priority-panel-head:hover { background:rgba(250,216,120,0.05); }
.priority-panel-title {
  font-size:12px; font-weight:600; color:var(--amber-lt);
  letter-spacing:0.06em; display:flex; align-items:center; gap:8px;
}
.priority-count-badge {
  background:var(--amber); color:#0C2E32; border-radius:10px;
  padding:1px 7px; font-size:10px; font-weight:700;
}
.priority-collapse-icon { font-size:10px; color:var(--text-dim); transition:transform .2s; }
.priority-collapse-icon.open { transform:rotate(180deg); }
.priority-list { padding:12px 18px; display:flex; flex-direction:column; gap:8px; }
.priority-item {
  display:flex; align-items:center; gap:12px; padding:10px 14px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
  border-radius:8px; transition:all .15s; cursor:pointer;
}
.priority-item:hover { background:rgba(255,255,255,0.08); border-color:rgba(232,150,42,0.2); }
.priority-item-name { font-size:13px; font-weight:600; color:var(--text); flex:1; }
.priority-item-meta { font-size:11px; color:var(--text-dim); flex:2; }
.priority-item-status { flex-shrink:0; }
.priority-item-remove {
  flex-shrink:0; font-size:12px; color:var(--text-dim); cursor:pointer;
  padding:2px 6px; border-radius:4px; border:1px solid transparent;
  transition:all .15s; background:none;
}
.priority-item-remove:hover { color:#FF8080; border-color:rgba(255,80,80,0.3); background:rgba(255,80,80,0.07); }
.priority-empty { font-size:12px; color:var(--text-dim); padding:8px 0; text-align:center; }

/* Modal priority row */
.modal-priority-row {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:rgba(250,216,120,0.06); border:1px solid rgba(250,216,120,0.18);
  border-radius:8px; margin-bottom:16px;
}
.modal-priority-label { font-size:12px; color:var(--amber-lt); flex:1; font-weight:500; }
.modal-priority-btn {
  padding:5px 14px; border-radius:6px; border:1px solid; cursor:pointer;
  font-size:11px; font-weight:600; font-family:'Inter',sans-serif; transition:all .15s;
}
.modal-priority-btn.on  { background:rgba(250,216,120,0.2); border-color:var(--amber-gl); color:var(--amber-gl); }
.modal-priority-btn.off { background:rgba(255,255,255,0.05); border-color:var(--border); color:var(--text-dim); }
.modal-priority-btn:hover { opacity:0.8; }

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }

/* ── NEW badge ─────────────────────────────────────────────────────────── */
.new-badge {
  position:absolute; top:-1px; right:-1px;
  background: linear-gradient(135deg, #E8962A, #FAD878);
  color: #0C2E32; font-size:8px; font-weight:800;
  padding:2px 7px; border-radius:0 10px 0 8px;
  letter-spacing:0.12em; line-height:1.6;
  box-shadow: 0 1px 6px rgba(232,150,42,0.4);
  z-index:2; pointer-events:none;
}

/* ── Swim Lanes ─────────────────────────────────────────────────────────── */
.lanes-wrap { padding: 16px 32px 48px; display:flex; flex-direction:column; gap:20px; }

.lane { border-radius:12px; overflow:hidden; border:1px solid var(--border); }
.lane.tier-s { border-color:rgba(255,100,80,0.3); }
.lane.tier-a { border-color:rgba(232,150,42,0.28); }
.lane.tier-b { border-color:rgba(100,160,255,0.2); }
.lane.tier-c { border-color:rgba(255,255,255,0.08); }

.lane-header {
  display:flex; align-items:center; gap:14px; padding:14px 20px;
  cursor:pointer; user-select:none; transition:background .15s;
}
.lane-header:hover { background:rgba(255,255,255,0.03); }
.lane.tier-s .lane-header { background:rgba(255,80,60,0.07); }
.lane.tier-a .lane-header { background:rgba(232,150,42,0.07); }
.lane.tier-b .lane-header { background:rgba(100,160,255,0.05); }
.lane.tier-c .lane-header { background:rgba(255,255,255,0.03); }

.lane-icon  { font-size:18px; flex-shrink:0; }
.lane-title { font-size:14px; font-weight:700; letter-spacing:0.03em; }
.lane.tier-s .lane-title { color:#FF8070; }
.lane.tier-a .lane-title { color:var(--amber-lt); }
.lane.tier-b .lane-title { color:#82AAFF; }
.lane.tier-c .lane-title { color:var(--text-dim); }

.lane-desc  { font-size:11px; color:var(--text-dim); flex:1; }
.lane-count {
  font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px;
  flex-shrink:0;
}
.lane.tier-s .lane-count { background:rgba(255,80,60,0.18); color:#FF8070; }
.lane.tier-a .lane-count { background:rgba(232,150,42,0.18); color:var(--amber-gl); }
.lane.tier-b .lane-count { background:rgba(100,160,255,0.15); color:#82AAFF; }
.lane.tier-c .lane-count { background:rgba(255,255,255,0.08); color:var(--text-dim); }

.lane-chevron { font-size:11px; color:var(--text-dim); transition:transform .2s; }
.lane-chevron.collapsed { transform:rotate(-90deg); }

.lane-body { padding:0 16px 16px; }
.lane-body.collapsed { display:none; }

/* ── Tier badge on card ─────────────────────────────────────────────────── */
.tier-pip {
  width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px;
}
.tier-pip.s { background:#FF8070; box-shadow:0 0 5px rgba(255,80,60,0.6); }
.tier-pip.a { background:var(--amber); box-shadow:0 0 5px rgba(232,150,42,0.5); }
.tier-pip.b { background:#82AAFF; box-shadow:0 0 5px rgba(100,160,255,0.4); }
.tier-pip.c { background:rgba(255,255,255,0.2); }

/* ── Partner badge ──────────────────────────────────────────────────────── */
.partner-badge {
  font-size:9px; font-weight:700; padding:2px 8px; border-radius:4px;
  background: linear-gradient(135deg, rgba(180,100,255,0.2), rgba(100,160,255,0.15));
  color:#C09DFF; border:1px solid rgba(160,100,255,0.35);
  letter-spacing:0.06em; white-space:nowrap;
}
.card.partner-card { box-shadow: 0 0 0 1px rgba(160,100,255,0.2), inset 0 0 24px rgba(160,100,255,0.03); }

// 写回模式：把 user_state.json（仅 status/note/priority/deleted_ids，~10 KB）作为
// 同步载荷。原本写回整个 leads.json (~180 KB) 在 Safari 上会触发 "网络连接已中断"，
// 因为 Safari 对较大的 PUT body 不稳定。改用小载荷绕开该 quirk。
var GH_OWNER='fyonyourside', GH_REPO='telos-talent', GH_BRANCH='gh-pages';
var GH_PATH='leads.json';                  // 只读：候选人主数据，由 daily 脚本维护
var GH_USER_STATE_PATH='user_state.json';  // 可写：用户标记态，浏览器端的唯一 PUT 目标

function getGHToken(){var _t=['ghp_TI7z','vgLbvesUWNPeUigF','3d2MSdpp1Y3Q5wG1'];return localStorage.getItem('telos_gh_token')||_t.join('');}

function showSaveStatus(msg,type){
  var el=document.getElementById('save-status'); if(!el)return;
  el.textContent=msg; el.className='save-status '+(type||'');
  if(type==='ok') setTimeout(function(){el.textContent='';el.className='save-status';},4000);

// 从 LEADS_DATA 提取当前的用户标记态，构造 user_state.json 载荷
function buildUserStatePayload(){
  var defaults={status:'new', note:'', priority:false};
  var states={};
  LEADS_DATA.leads.forEach(function(l){
    var s={};
    Object.keys(defaults).forEach(function(k){
      var v=(k in l)?l[k]:defaults[k];
      if(v!==defaults[k]) s[k]=v;
    });
    if(Object.keys(s).length) states[l.id]=s;
  });
  var deleted = (LEADS_DATA.meta && LEADS_DATA.meta.deleted_ids) || [];
  return {
    version: 1,
    last_updated: new Date().toISOString(),
    user_states: states,
    deleted_ids: deleted.slice().sort()
  };
}

function flushToGitHub(onDone){
  var token=getGHToken();
  if(!token){showSaveStatus('⚙️ 请配置 Token','warn'); if(onDone) onDone(false); return;}
  showSaveStatus('⏳ 同步中...','saving');
  var base='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_USER_STATE_PATH;
  var hdrs={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};

  // 1) 获取 user_state.json 的最新 SHA。如果文件不存在（首次推送），SHA 留空。
  fetch(base+'?ref='+GH_BRANCH+'&_='+Date.now(), {headers:hdrs, cache:'no-store'})
    .then(function(r){
      if(r.status===404) return {sha:null};  // 文件不存在，PUT 时不传 sha 即可创建
      if(!r.ok) throw new Error('SHA fetch '+r.status);
      return r.json();
    })
    .then(function(info){
      var payload=buildUserStatePayload();
      var body=JSON.stringify(payload,null,2);
      var enc=btoa(unescape(encodeURIComponent(body)));
      var put={message:'chore: update user state',content:enc,branch:GH_BRANCH};
      if(info.sha) put.sha=info.sha;
      return fetch(base,{method:'PUT',headers:hdrs,body:JSON.stringify(put)});
    })
    .then(function(r){
      if(!r.ok){
        return r.json().then(function(e){ throw new Error(e.message||r.status); });
      }
      showSaveStatus('✓ 已同步','ok');
      if(onDone) onDone(true);
    })
    .catch(function(e){
      showSaveStatus('✗ 同步失败: '+e.message,'err');
      console.error('[telos]',e);
      if(onDone) onDone(false);
    });
}

var _pendingSave = false;
function scheduleSave(){
  _pendingSave = true;
  clearTimeout(_st);
  _st=setTimeout(function(){ flushToGitHub(function(){ _pendingSave=false; }); }, 1200);
}

function setStatus(id,s){if(leadsIndex[id]){leadsIndex[id].status=s;scheduleSave();}}

// ── Delete (hard remove, tracked via meta.deleted_ids so it won't come back) ──
function deleteLead(id, e) {
  if(e) e.stopPropagation();
  const lead = leadsIndex[id];
  if(!lead) return;
  const displayName = (lead.name || id).split(' / ')[0];
  if(!confirm('确定彻底删除【' + displayName + '】?\n\n该候选人将从看板和数据库永久移除，未来自动搜索也不会再添加进来。')) return;

  // 1. 从 LEADS_DATA.leads 移除
  const idx = LEADS_DATA.leads.findIndex(l => l.id === id);
  if(idx >= 0) LEADS_DATA.leads.splice(idx, 1);

  // 2. 从索引移除
  delete leadsIndex[id];

  // 3. 记录到 meta.deleted_ids（权威删除列表，供 feishu_sync.py 和日常搜索脚本跳过）
  if(!LEADS_DATA.meta.deleted_ids) LEADS_DATA.meta.deleted_ids = [];
  if(LEADS_DATA.meta.deleted_ids.indexOf(id) === -1) LEADS_DATA.meta.deleted_ids.push(id);

  // 4. 更新总数
  LEADS_DATA.meta.total = LEADS_DATA.leads.length;

  // 5. 关闭 modal（如正在显示该 lead）
  if(openId === id) {
    document.getElementById('modal').classList.remove('open');
    openId = null;
  }

  // 6. 重新渲染 + 推送
  renderAll(); renderStats(); renderPriorityPanel();
  scheduleSave();
  showSaveStatus('🗑 已删除 ' + displayName + '，同步中...', 'saving');
}

  document.querySelectorAll('[data-dim]').forEach(c => c.classList.remove('active'));

  activeDim = el.dataset.dim;
  applyFilters();
}
function toggleFilter(el) {
  const f = el.dataset.filter;
  if(activeFilters.has(f)) { activeFilters.delete(f); el.classList.remove('active'); }
  else { activeFilters.add(f); el.classList.add('active'); }
  applyFilters();
}
function matchesFilters(lead) {
  const q = document.getElementById('search-input').value.toLowerCase();
  if(q) {
    const hay = [lead.name, lead.current, lead.bg, lead.skills.join(' '), lead.location, lead.role].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  // Dimension filter
  const dimCount = (lead.is_eng?1:0)+(lead.is_pm?1:0)+(lead.is_algo?1:0);
  if(activeDim === 'eng'   && !lead.is_eng)  return false;
  if(activeDim === 'pm'    && !lead.is_pm)   return false;
  if(activeDim === 'algo'  && !lead.is_algo) return false;
  if(activeDim === 'two'   && dimCount < 2)  return false;
  if(activeDim === 'three' && dimCount < 3)  return false;
  if(activeFilters.has('voice')    && !lead.voice) return false;
  if(activeFilters.has('new')      && getStatus(lead.id) !== 'new') return false;
  if(activeFilters.has('priority') && !getPriority(lead.id)) return false;
  if(activeFilters.has('partner')  && !lead.partner_potential) return false;
  if(activeFilters.has('converted')&& getStatus(lead.id) !== 'converted') return false;
  // Academic shown by default (removed explicit acad toggle)
  return true;
}

// ── Tier config ───────────────────────────────────────────────────────────
const TIER_CONFIG = {
  S: { icon:'🔥', label:'S — 立刻出手', desc:'技能完美契合 · 有可联系信号 · 优先级最高', cls:'tier-s' },
  A: { icon:'🎯', label:'A — 本周外联', desc:'强匹配 · 适合现在冷接触', cls:'tier-a' },
  B: { icon:'🕐', label:'B — 定期热身', desc:'有潜力但壁垒较高（大厂 / 海外 / 学术）', cls:'tier-b' },
  C: { icon:'📋', label:'C — 储备观察', desc:'背景相关 · 暂不紧迫', cls:'tier-c' },
};
const LANE_ORDER = ['S','A','B','C'];
const laneCollapsed = { S:false, A:false, B:false, C:true };

// Compute the latest date_found across all leads
const LATEST_DATE = LEADS_DATA.leads.reduce((max,l)=> l.date_found > max ? l.date_found : max, '');
function isNew(lead) { return lead.date_found === LATEST_DATE; }

function toggleLane(tier) {
  laneCollapsed[tier] = !laneCollapsed[tier];
  const body = document.getElementById('lane-body-'+tier);
  const chev = document.getElementById('lane-chev-'+tier);
  if(body) body.classList.toggle('collapsed', laneCollapsed[tier]);
  if(chev) chev.classList.toggle('collapsed', laneCollapsed[tier]);
}

function renderAll() {
  const leads = LEADS_DATA.leads;
  const visible = leads.filter(matchesFilters);
  const wrap  = document.getElementById('lanes-wrap');
  const empty = document.getElementById('empty');

  if(!visible.length) { wrap.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  // Group by tier; 'pass' leads always drop to C
  const byTier = { S:[], A:[], B:[], C:[] };
  visible.sort((a,b)=> b.score-a.score || (isNew(b)?1:0)-(isNew(a)?1:0))
         .forEach(l => {
           const effectiveTier = (getStatus(l.id) === 'pass') ? 'C' : (l.tier || 'C');
           (byTier[effectiveTier] = byTier[effectiveTier]||[]).push(l);
         });

  wrap.innerHTML = LANE_ORDER.map(tier => {
    const group = byTier[tier] || [];
    if(!group.length) return '';
    const cfg = TIER_CONFIG[tier];
    const collapsed = laneCollapsed[tier];
    return `
    <div class="lane ${cfg.cls}">
      <div class="lane-header" onclick="toggleLane('${tier}')">
        <span class="lane-icon">${cfg.icon}</span>
        <div style="flex:1">
          <div class="lane-title">${cfg.label}</div>
          <div class="lane-desc">${cfg.desc}</div>
        </div>
        <span class="lane-count">${group.length} 人</span>
        <span class="lane-chevron ${collapsed?'collapsed':''}" id="lane-chev-${tier}">▼</span>
      </div>
      <div class="lane-body ${collapsed?'collapsed':''}" id="lane-body-${tier}">
        <div class="grid">${group.map(renderCard).join('')}</div>
      </div>
    </div>`;
  }).join('');

  renderPriorityPanel();
}

function applyFilters() { renderAll(); }

// ── Init ──────────────────────────────────────────────────────────────────
// On load: 并行拉取 leads.json（候选人主数据）和 user_state.json（用户标记态）
//   - leads.json 由 daily 脚本维护，可能比内嵌的 LEADS_DATA 更新
//   - user_state.json 是浏览器端的真实标记态权威，叠加到 LEADS_DATA 之上
(function initDashboard(){
  var token = getGHToken();

  function apiContentUrl(path){
    return 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?ref='+GH_BRANCH+'&_='+Date.now();
  }
  function rawUrl(path){
    return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+path+'?_='+Date.now();
  }
  function decodeApiContent(info){
    var b64 = info.content.replace(/\n/g,'');
    return decodeURIComponent(escape(atob(b64)));
  }

  function fetchJson(path){
    if(token){
      return fetch(apiContentUrl(path), {
        headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},
        cache:'no-store'
      }).then(function(r){
        if(r.status===404) return null;
        if(!r.ok) throw new Error('fetch '+path+' '+r.status);
        return r.json().then(function(info){ return JSON.parse(decodeApiContent(info)); });
      }).catch(function(e){
        console.warn('[telos] API fetch '+path+' failed, falling back to raw:', e);
        return fetch(rawUrl(path), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : (r.status===404 ? null : Promise.reject(r.status)); })
          .catch(function(){ return null; });
      });
    }else{
      return fetch(rawUrl(path), {cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : (r.status===404 ? null : Promise.reject(r.status)); })
        .catch(function(){ return null; });
    }
  }

  function applyDeletedIds(deleted){
    if(!LEADS_DATA.meta.deleted_ids) LEADS_DATA.meta.deleted_ids = [];
    (deleted||[]).forEach(function(id){
      if(LEADS_DATA.meta.deleted_ids.indexOf(id) === -1) LEADS_DATA.meta.deleted_ids.push(id);
    });
    var deletedSet = {};
    LEADS_DATA.meta.deleted_ids.forEach(function(id){ deletedSet[id] = true; });
    // 从本地数据中移除已删除的条目
    LEADS_DATA.leads = LEADS_DATA.leads.filter(function(l){
      if(deletedSet[l.id]){ delete leadsIndex[l.id]; return false; }
      return true;
    });
    return deletedSet;
  }

  function mergeLeadsCanonical(data, deletedSet){
    if(!data) return;
    // 合并远端 leads.json 中的候选人主数据（不覆盖用户标记字段）
    data.leads.forEach(function(live){
      if(deletedSet[live.id]) return;
      var local = leadsIndex[live.id];
      if(local){
        // 已有：用 live 的非状态字段覆盖（保留浏览器端可能正在编辑的 status/note/priority）
        Object.keys(live).forEach(function(k){
          if(k==='status'||k==='note'||k==='priority') return;
          local[k] = live[k];
        });
      }else{
        LEADS_DATA.leads.push(live);
        leadsIndex[live.id] = live;
      }
    });
    if(data.meta){
      LEADS_DATA.meta.last_updated = data.meta.last_updated || LEADS_DATA.meta.last_updated;
    }
    LEADS_DATA.meta.total = LEADS_DATA.leads.length;
  }

  function applyUserState(us){
    // user_state.json 是用户标记态权威。如果浏览器端正在编辑（_pendingSave），跳过覆盖。
    if(!us || _pendingSave) return;
    var states = us.user_states || {};
    LEADS_DATA.leads.forEach(function(l){
      var s = states[l.id];
      // 默认值清零（即使 user_state 没有该条目，也要重置为默认，
      // 这样在另一台设备取消标记后，本设备刷新能感知）
      l.status   = (s && 'status'   in s) ? s.status   : 'new';
      l.note     = (s && 'note'     in s) ? s.note     : '';
      l.priority = (s && 'priority' in s) ? s.priority : false;
    });
  }

  function finish(){ renderStats(); renderAll(); renderPriorityPanel(); prefetchSha(); }

  Promise.all([fetchJson(GH_PATH), fetchJson(GH_USER_STATE_PATH)]).then(function(arr){
    var leadsData = arr[0];
    var userState = arr[1];
    // 1) 先用合并后的删除列表（远端 leads.meta.deleted_ids ∪ user_state.deleted_ids）
    var deleted = [].concat(
      (leadsData && leadsData.meta && leadsData.meta.deleted_ids) || [],
      (userState && userState.deleted_ids) || []
    );
    var deletedSet = applyDeletedIds(deleted);
    // 2) 合并候选人主数据
    mergeLeadsCanonical(leadsData, deletedSet);
    // 3) 叠加用户标记态
    applyUserState(userState);
  }).catch(function(e){
    console.warn('[telos] init load error:', e);
  }).finally(finish);
})();

}
function closeTkm(){document.getElementById('tkm').style.display='none';}
function clrTkm(){
  localStorage.removeItem('telos_gh_token');
  document.getElementById('tki').value='';
  document.getElementById('tks').textContent='已清除';
}
function saveTkm(){
  var token=document.getElementById('tki').value.trim();
  var s=document.getElementById('tks');
  if(!token){s.textContent='请输入 Token';return;}
  s.textContent='验证中...'; s.style.color='rgba(255,255,255,0.5)';
  fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH+'?ref='+GH_BRANCH,
    {headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}})
    .then(function(r){
      if(r.status===401)throw new Error('Token 无效或无权限');
      if(!r.ok)throw new Error('HTTP '+r.status);
      localStorage.setItem('telos_gh_token',token);
      s.textContent='✓ 验证成功，已保存！'; s.style.color='#6CD97E';
      setTimeout(closeTkm,1500);
    })
    .catch(function(e){s.textContent='✗ '+e.message;s.style.color='#FF7070';});
}
if(!getGHToken()) setTimeout(function(){showSaveStatus('⚙️ 配置 Token 后状态可共享','warn');},1500);

<div id="tkm" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.72);align-items:center;justify-content:center" onclick="if(event.target===this)closeTkm()">

<script>
(function(){
  var HASH = '8a011780846b38e0756d2c6816c2070c9dae34e59930c7a8b98b273deece32e2';
  var KEY  = 'telos_access';

  function sha256(str){
    var buf = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buf).then(function(h){
      return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }

  function showMain(){document.getElementById('main-content').style.display='';document.getElementById('access-gate').style.display='none';}
  function showGate(){ document.getElementById('access-gate').style.display='flex'; }

  window.checkGate = function(){
    var val = document.getElementById('gate-input').value.trim();
    sha256(val).then(function(h){
      if(h === HASH){
        localStorage.setItem(KEY,'1');
        document.getElementById('access-gate').style.display='none';
        showMain();
        document.getElementById('gate-input').value='';
      } else {
        document.getElementById('gate-err').textContent='访问码不正确，请重试';
        document.getElementById('gate-input').value='';
        document.getElementById('gate-input').focus();
      }
    });
  };

  if(localStorage.getItem(KEY)==='1'){ showMain(); }
  else { showGate(); setTimeout(function(){ document.getElementById('gate-input').focus(); }, 100); }
})();
</script>
